name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          # Podman in the host container needs a rootful, privileged container.
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # The example's secrets reach the host write-only, so state holds
      # none of them, and nothing Conn3x writes under .terraform does either.
      # .terraform/modules is left out: it holds downloaded module code.
      - name: Check the secrets stay out of state
        working-directory: examples/local
        run: |
          if grep -rqF --exclude-dir=modules -e correct-horse-battery terraform.tfstate .terraform/; then
            echo "A secret from the example is in terraform.tfstate or under .terraform/." >&2
            exit 1
          fi
      # dig and curl come with the Pi-hole image, which shares the host's
      # network, so 127.0.0.1 is the host container's.
      - name: Check blocking, resolving, local records, the blocklist and the API
        run: &use |
          sudo podman exec -i circuit-pihole podman exec -i pihole sh -eux <<'EOF'
          [ "$(dig +short @127.0.0.1 doubleclick.net A)" = 0.0.0.0 ]
          dig +short @127.0.0.1 example.com A | grep -Eqv '^0\.0\.0\.0$'
          [ "$(dig +short @127.0.0.1 nas.home.arpa A)" = 192.168.1.20 ]
          [ "$(pihole-FTL sqlite3 /etc/pihole/gravity.db "SELECT number > 0 FROM adlist WHERE comment = 'Managed by Conn3x'")" = 1 ]
          curl -sf -X POST http://127.0.0.1:8080/api/auth -d '{"password":"correct-horse-battery"}' | grep -q '"valid":true'
          curl -s -X POST http://127.0.0.1:8080/api/auth -d '{"password":"wrong-password"}' | grep -q '"valid":false'
          EOF
      - name: Check the unit pulls the image by digest
        run: sudo podman exec circuit-pihole sh -c 'grep -q "^Image=.*@sha256:" /etc/containers/systemd/*.container'
      # Restarting the container boots systemd again, so this checks Quadlet
      # starts Pi-hole by itself, it answers with the same settings, and the
      # plan has nothing to do.
      - name: Restart the host, then check Pi-hole comes back and the plan
        working-directory: examples/local
        run: |
          sudo podman restart circuit-pihole
          sudo podman exec circuit-pihole timeout 60 systemctl is-system-running --wait || true
          for _ in $(seq 60); do
            sudo podman exec circuit-pihole podman exec pihole dig +short +time=1 +tries=1 @127.0.0.1 nas.home.arpa A 2>/dev/null | grep -qx 192.168.1.20 && break
            sleep 2
          done
          conn3x plan -detailed-exitcode
      - name: Check blocking, resolving, local records, the blocklist and the API after the restart
        run: *use
      # A fresh host gets the previous image, then the circuit's own pin is
      # applied over it, the way someone raises pihole_version. The image
      # labels itself with its version.
      - name: Upgrade from Pi-hole 2026.09.0 on a fresh host, then plan again with no changes
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          PODMAN: sudo podman
        run: |
          ./down.sh
          ./up.sh
          conn3x init
          conn3x apply -auto-approve -var pihole_version=2026.09.0 -var image_digest=sha256:5b9c8cf51de7d6d3f2240dbe72baf5f06e1fd39cb4d77a99fab4fa13e23bd1be
          tag() { sudo podman exec circuit-pihole podman inspect pihole --format '{{index .Config.Labels "org.opencontainers.image.version"}}'; }
          v=$(tag); [ "$v" = 2026.09.0 ] || { echo "Pi-hole runs image $v, not 2026.09.0" >&2; exit 1; }
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          v=$(tag); [ "$v" = 2026.10.0 ] || { echo "Pi-hole runs image $v, not 2026.10.0" >&2; exit 1; }
      - name: Check blocking, resolving, local records, the blocklist and the API after the upgrade
        run: *use
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
